<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <title>Doodads</title>
  <link rel="stylesheet" href="shared/base.css" />
  <script src="/pwa-init.js"></script>
  <style>
    body {
      display: flex; flex-direction: column; align-items: center;
      padding: calc(28px + var(--safe-top)) calc(14px + var(--safe-right)) calc(32px + var(--safe-bottom)) calc(14px + var(--safe-left));
    }
    h1 { font-size: 36px; font-weight: 700; margin: 0 0 18px; }

    /* A shelf: a tinted panel in the shelf's color, holding its toys' tiles */
    .shelf {
      width: 100%; max-width: 860px; margin-bottom: 14px;
      padding: 10px 12px 12px; border-radius: 26px;
      background: rgba(255,255,255,0.07);
      background: color-mix(in srgb, var(--shelf) 13%, transparent);
      border: 1px solid rgba(255,255,255,0.12);
      border-color: color-mix(in srgb, var(--shelf) 35%, transparent);
    }
    .shelf h2 {
      margin: 0 0 8px 6px; font-size: 16px; font-weight: 600; letter-spacing: 0.4px;
      color: var(--shelf);
    }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    /* A tile: the toy's picture on its own color, with the name on a band below */
    a.tile {
      display: flex; flex-direction: column; overflow: hidden;
      border-radius: 20px; text-decoration: none; color: var(--color-text);
      background: linear-gradient(135deg, var(--a), var(--b));
      box-shadow: 0 5px 14px color-mix(in srgb, var(--a) 40%, transparent), inset 0 2px 0 rgba(255,255,255,0.3);
      transition: transform 0.12s ease;
      -webkit-touch-callout: none;
    }
    a.tile:active { transform: scale(0.94); }
    @media (hover: hover) { a.tile:hover { transform: translateY(-3px); } }
    .tile .pic {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 14px 0 10px; font-size: 50px; line-height: 1;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.25));
    }
    .tile .text-pic { font-weight: 700; font-size: 58px; line-height: 50px; }
    .tile .name {
      display: flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 5px 6px;
      background: rgba(0,0,0,0.22);
      font-size: 14px; font-weight: 600; line-height: 1.2; text-align: center;
    }

    /* Tablets and up: every shelf fits on one row */
    @media (min-width: 640px) {
      body { padding-top: calc(36px + var(--safe-top)); padding-left: calc(24px + var(--safe-left)); padding-right: calc(24px + var(--safe-right)); }
      h1 { font-size: 44px; margin-bottom: 24px; }
      .shelf { padding: 12px 16px 16px; margin-bottom: 18px; }
      .shelf h2 { font-size: 19px; margin-bottom: 10px; }
      .tiles { grid-template-columns: repeat(5, 1fr); gap: 14px; }
      .tile .pic { padding: 20px 0 14px; font-size: 68px; }
      .tile .text-pic { font-size: 78px; line-height: 68px; }
      .tile .name { min-height: 50px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <h1 class="gradient-text">Doodads</h1>
  <!-- The shelves and tiles are built from shared/toys.js (hubPlugin in vite.config.js) -->
  <!-- toys -->

</body>
</html>
